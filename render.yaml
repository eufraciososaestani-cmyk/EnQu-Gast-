services:
  - type: web
    name: enquegaste
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: enquegaste-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Correo de la cuenta de administrador (cuando esa persona se crea su cuenta, queda como admin)
      - key: ADMIN_EMAIL
        sync: false

databases:
  - name: enquegaste-db
    databaseName: enquegaste
    plan: basic-256mb
